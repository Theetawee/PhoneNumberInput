name: Stage Package to npm

on:
    push:
        branches:
            - main

# CRITICAL: Grants permission to mint secure OIDC tokens
permissions:
    id-token: write
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"
                  registry-url: "https://npmjs.org"

            # Standard npm installation flow matching your package lock parameters
            - name: Install Dependencies
              run: npm ci

            - name: Build Production Assets
              run: npm run build

            # Authenticates token-free using the dynamic OIDC handshake
            - name: Stage Release on npm
              run: npx npm stage publish --access public
